services:
  postgres:
    image: postgres:16-alpine
    container_name: automifychat-postgres
    environment:
      POSTGRES_DB: automifychat
      POSTGRES_USER: automifychat
      POSTGRES_PASSWORD: automifychat
    ports:
      - "5432:5432"
    volumes:
      - automifychat-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U automifychat -d automifychat"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  automifychat-pgdata:
